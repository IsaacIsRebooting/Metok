syntax = "proto3";

package api.basesvr.v1;


option go_package = "github.com/IsaacIsRebooting/Metok/backend/basesvr/api/basesvr/v1;v1";
option java_multiple_files = true;
option java_package = "api.basesvr.v1";

service Account {
	// 用户注册
	rpc Register (RegisterRequest) returns (RegisterReply);
	
	//  账户登录
	rpc Check (CheckRequest) returns (CheckReply);

	// 绑定凭证
	rpc Bind (BindRequest) returns (BindReply);

	// 解绑凭证
	rpc Unbind (UnbindRequest) returns (UnbindReply);

}

// 用户注册
message Metadata {
	int32 biz_code = 1;
	string message = 2;
	string domain = 3;
	repeated string reason = 4;
}
message RegisterRequest {
	string mobile = 1;
	string email = 2;
	string password = 3;
}
message RegisterReply {
	Metadata meta = 1;
	int64 account_id = 2;
}

// 账户验证
message CheckRequest {
	string mobile = 1;
	string email = 2;
	int64 account_id = 3;
	string password = 4;
}
message CheckReply {
	Metadata meta = 1;
	int64 account_id = 2;
}

// 绑定凭证
enum VoucherType {
	MOBILE = 0;
	EMAIL = 1;
}
message BindRequest {
	int64 account_id = 1;
	VoucherType voucher_type = 2;
	string voucher = 3;
}
message BindReply {
	Metadata meta = 1;
}

// 解绑凭证
message UnbindRequest {
	string account_id = 1;
	VoucherType voucher_type = 2;
	string voucher = 3;
}
message UnbindReply {
	Metadata meta = 1;
}
